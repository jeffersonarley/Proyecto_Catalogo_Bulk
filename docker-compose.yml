services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/catalogo_bulk
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret
      - JWT_EXPIRES_IN=1h
      - MAX_FILE_SIZE_MB=5
      - BATCH_SIZE=100
      - CACHE_TTL_SECONDS=60
      - IMPORT_ERRORS_CAP=100
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  mongo_data:
